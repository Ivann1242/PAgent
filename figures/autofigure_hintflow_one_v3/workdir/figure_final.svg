<svg width="2400" height="1000" viewBox="0 0 2400 1000" xmlns="http://www.w3.org/2000/svg" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';"> <defs> <style> /* --- Fonts --- */ .title-main { font-size: 48px; font-weight: 600; text-anchor: middle; } .title-sub { font-size: 24px; font-weight: 400; text-anchor: middle; color: #555555; } .footer-text { font-size: 20px; font-weight: 400; text-anchor: middle; color: #666666; font-style: italic; } .module-title { font-size: 26px; font-weight: 600; text-anchor: middle; } .module-model { font-size: 20px; font-weight: 400; text-anchor: middle; color: #444444; } .module-formula { font-family: 'Times New Roman', serif; font-size: 24px; text-anchor: middle; } .module-note { font-size: 18px; font-style: italic; color: #777777; text-anchor: middle; } .placeholder-exterior-label { font-size: 18px; font-weight: 500; text-anchor: middle; fill: #333333; } .placeholder-interior-text { font-size: 16px; font-weight: 400; text-anchor: middle; fill: #444444; } .chip-text { font-size: 22px; font-weight: bold; text-anchor: middle; fill: #ffffff; } .bottom-panel-title { font-size: 24px; font-weight: 600; text-anchor: middle; } .bottom-panel-text { font-size: 19px; } .bottom-panel-formula { font-family: 'Times New Roman', serif; font-size: 20px; text-anchor: middle; } .fail-closed-card-text { font-size: 18px; text-anchor: middle; } /* --- Colors --- */ .color-hint { fill: #FFF8E1; stroke: #FFC107; } /* Amber */ .color-solver { fill: #E0F2F1; stroke: #009688; } /* Teal-blue */ .color-selector { fill: #FBE9E7; stroke: #FF7043; } /* Coral-ish for container */ .color-keep { fill: #4CAF50; } /* Green */ .color-replace { fill: #FF7043; } /* Coral */ .color-default-box { fill: #F5F5F5; stroke: #BDBDBD; } /* --- Arrows --- */ .arrow { stroke: #555555; stroke-width: 2.5; fill: none; } .arrow-thin { stroke: #888888; stroke-width: 1.5; fill: none; } </style> <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto"> <polygon points="0 0, 10 3.5, 0 7" fill="#555555" /> </marker> </defs> <!-- Title & Subtitle --> <text x="1200" y="55" class="title-main">HintFlow_one — Blind Free-Form Routing with Fail-Closed Selection</text> <text x="1200" y="90" class="title-sub">Train hint policy π_θ(h|x) · freeze strong solver π_S · residual KEEP/REPLACE</text> <!-- MAIN PIPELINE --> <!-- [1] Problem --> <g transform="translate(100, 270)"> <rect x="0" y="0" width="180" height="230" rx="12" ry="12" class="color-default-box" stroke-width="2"/> <text x="90" y="-15" class="placeholder-exterior-label">Problem</text> <rect x="15" y="15" width="150" height="150" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="90" y="85" class="placeholder-interior-text" dy="-0.5em">[icon]: A document with a</text> <text x="90" y="85" class="placeholder-interior-text" dy="0.5em">large math 'x' overlaid.</text> <text x="90" y="200" class="module-formula" style="font-size: 36px; font-weight: bold;">x</text> <text x="90" y="200" dy="25" class="module-note">(math query)</text> </g> <!-- [2] Hint Policy --> <g transform="translate(400, 270)"> <rect x="0" y="0" width="300" height="230" rx="12" ry="12" class="color-hint" stroke-width="2"/> <text x="150" y="-15" class="placeholder-exterior-label">Hint Policy (Trainable)</text> <rect x="75" y="15" width="150" height="90" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="150" y="55" class="placeholder-interior-text">[icon]: A friendly, flat-style</text> <text x="150" y="75" class="placeholder-interior-text">robot head, sticker-like.</text> <text x="150" y="130" class="module-title">Hint Policy</text> <text x="150" y="158" class="module-model">Qwen3-4B · Blind FF-SFT</text> <text x="150" y="195" class="module-formula">h ~ π<tspan dy="6">θ</tspan>(h | x)</text> <text x="150" y="222" class="module-note">no solver trace / no y₀</text> </g> <!-- [3] Solvers --> <g transform="translate(820, 160)"> <rect x="0" y="0" width="400" height="350" rx="12" ry="12" class="color-solver" stroke-width="2"/> <!-- 3a: Challenger Solve --> <g transform="translate(40, 20)"> <text x="160" y="-15" class="placeholder-exterior-label">Challenger Solve (Frozen)</text> <rect x="85" y="10" width="150" height="90" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="160" y="50" class="placeholder-interior-text">[icon]: Robot head with a</text> <text x="160" y="70" class="placeholder-interior-text">small padlock in the corner.</text> <text x="160" y="125" class="module-title">Challenger Solve</text> <text x="160" y="150" class="module-model">Frozen π<tspan dy="6">S</tspan> · GPT-OSS-20B</text> <text x="160" y="180" class="module-formula">y<tspan dy="6">1</tspan> ~ π<tspan dy="6">S</tspan>(y | x, h)</text> </g> <!-- 3b: Bare Baseline --> <g transform="translate(40, 195)"> <text x="160" y="-15" class="placeholder-exterior-label">Bare Baseline (Frozen)</text> <rect x="85" y="10" width="150" height="90" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="160" y="50" class="placeholder-interior-text">[icon]: Robot head with a</text> <text x="160" y="70" class="placeholder-interior-text">small padlock in the corner.</text> <text x="160" y="125" class="module-title">Bare Baseline</text> <text x="160" y="150" class="module-model">Frozen π<tspan dy="6">S</tspan> · same weights</text> <text x="160" y="180" class="module-formula">y<tspan dy="6">0</tspan> ~ π<tspan dy="6">S</tspan>(y | x)</text> </g> </g> <!-- [4] Conservative Selector --> <g transform="translate(1340, 270)"> <rect x="0" y="0" width="300" height="230" rx="12" ry="12" class="color-selector" stroke-width="2"/> <text x="150" y="-15" class="placeholder-exterior-label">Conservative Selector</text> <rect x="75" y="15" width="150" height="90" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="150" y="55" class="placeholder-interior-text">[icon]: A friendly, flat-style</text> <text x="150" y="75" class="placeholder-interior-text">robot head, sticker-like.</text> <text x="150" y="130" class="module-title">Conservative Selector</text> <text x="150" y="158" class="module-model">Qwen3-4B · fail-closed</text> <text x="150" y="188" class="module-formula">REPLACE iff conf ≥ τ, τ = 0.90</text> <g transform="translate(30, 205)"> <rect x="0" y="0" width="110" height="35" rx="8" ry="8" class="color-keep"/> <text x="55" y="23" dominant-baseline="middle" class="chip-text">KEEP</text> <rect x="130" y="0" width="110" height="35" rx="8" ry="8" class="color-replace"/> <text x="185" y="23" dominant-baseline="middle" class="chip-text">REPLACE</text> </g> </g> <!-- [5] Output --> <g transform="translate(1760, 270)"> <rect x="0" y="0" width="280" height="230" rx="12" ry="12" class="color-default-box" stroke-width="2"/> <text x="140" y="120" class="module-title">Final Output ŷ</text> <text x="140" y="165" class="module-formula" style="font-size: 28px;">ŷ = (1-d) y<tspan dy="6">0</tspan> + d y<tspan dy="6">1</tspan></text> <text x="140" y="-15" class="placeholder-exterior-label">Output</text> <rect x="65" y="15" width="150" height="90" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="140" y="55" class="placeholder-interior-text">[icon]: A finalized document</text> <text x="140" y="75" class="placeholder-interior-text">with a green checkmark.</text> </g> <!-- Arrows --> <path d="M 280 385 C 340 385, 340 385, 400 385" class="arrow" marker-end="url(#arrowhead)"/> <text x="340" y="375" font-size="24" text-anchor="middle">x</text> <path d="M 700 385 C 760 385, 760 250, 820 250" class="arrow" marker-end="url(#arrowhead)"/> <text x="755" y="315" font-size="24" text-anchor="middle">h</text> <text x="755" y="340" class="module-note">(hint)</text> <path d="M 700 385 C 750 385, 750 440, 820 440" class="arrow-thin" style="stroke-dasharray: 5,5;" /> <path d="M 280 385 C 400 520, 700 520, 820 440" class="arrow" marker-end="url(#arrowhead)"/> <text x="550" y="535" font-size="24" text-anchor="middle">x</text> <path d="M 1220 250 C 1280 250, 1280 385, 1340 385" class="arrow" marker-end="url(#arrowhead)"/> <text x="1275" y="315" font-size="24" text-anchor="middle">y<tspan dy="6">1</tspan></text> <path d="M 1220 440 C 1280 440, 1280 385, 1340 385" class="arrow" marker-end="url(#arrowhead)"/> <text x="1275" y="420" font-size="24" text-anchor="middle">y<tspan dy="6">0</tspan></text> <path d="M 1640 385 C 1700 385, 1700 385, 1760 385" class="arrow" marker-end="url(#arrowhead)"/> <text x="1700" y="375" font-size="24" text-anchor="middle" class="module-formula">d</text> <!-- BOTTOM PANELS --> <g transform="translate(100, 560)"> <!-- A) Distribution change --> <rect x="0" y="0" width="600" height="340" rx="12" ry="12" class="color-default-box" stroke-width="2"/> <text x="300" y="40" class="bottom-panel-title">A) Distribution Change Induced by Hint</text> <g transform="translate(50, 60)"> <!-- Curve 1: Bare --> <path d="M 50 150 C 100 50, 200 50, 250 150" stroke="#009688" stroke-width="3" fill="none"/> <path d="M 30 150 L 270 150" stroke="#555" stroke-width="1.5"/> <text x="150" y="175" text-anchor="middle" class="bottom-panel-text">Bare Output: π<tspan dy="3">S</tspan>(y|x)</text> <text x="150" y="130" font-size="24px" text-anchor="middle" class="module-formula">y<tspan dy="6">0</tspan></text> <!-- Curve 2: Hinted --> <path d="M 300 150 C 350 50, 450 50, 500 150" stroke="#FFC107" stroke-width="3.5" fill="none" stroke-dasharray="8 4"/> <path d="M 280 150 L 520 150" stroke="#555" stroke-width="1.5"/> <text x="400" y="175" text-anchor="middle" class="bottom-panel-text" fill="#C66900">Hinted Output: π<tspan dy="3">S</tspan>(y|x,h)</text> <text x="400" y="130" font-size="24px" text-anchor="middle" class="module-formula">y<tspan dy="6">1</tspan></text> <text x="275" y="80" text-anchor="middle" style="font-size:30px; fill:#555;">→</text> <text x="275" y="110" text-anchor="middle" class="module-note">(shifted mass)</text> </g> <text x="300" y="260" class="bottom-panel-formula">Selector gates acceptance based on embedding change:</text> <text x="300" y="300" class="bottom-panel-formula" style="font-size: 24px;">Δe = ||e(y<tspan dy="6">1</tspan>) − e(y<tspan dy="6">0</tspan>)||<tspan dy="6">2</tspan></text> <!-- B) Paired outcomes --> <g transform="translate(680, 0)"> <rect x="0" y="0" width="600" height="160" rx="12" ry="12" class="color-default-box" stroke-width="2"/> <text x="300" y="40" class="bottom-panel-title">B) Paired Outcomes vs Baseline</text> <text x="40" y="85" class="bottom-panel-text"><tspan fill="#4CAF50" font-weight="bold">● Recover:</tspan> EM(y<tspan dy="3">0</tspan>)=0, EM(ŷ)=1</text> <text x="40" y="125" class="bottom-panel-text"><tspan fill="#FF7043" font-weight="bold">● Harm:</tspan> EM(y<tspan dy="3">0</tspan>)=1, EM(ŷ)=0</text> <text x="330" y="85" class="bottom-panel-text"><tspan fill="#666666" font-weight="bold">● No-change:</tspan> EM(y<tspan dy="3">0</tspan>)=EM(ŷ)</text> </g> <!-- C) Fail-closed rules --> <g transform="translate(680, 180)"> <rect x="0" y="0" width="600" height="160" rx="12" ry="12" class="color-default-box" stroke-width="2"/> <text x="300" y="30" class="bottom-panel-title">C) Fail-Closed Rules (Default is KEEP)</text> <g class="fail-closed-card-text"> <rect x="15" y="45" width="180" height="45" rx="6" ry="6" fill="#f0f0f0" stroke="#ccc"/> <text x="105" y="72" dominant-baseline="middle">R1: baseline-first → KEEP</text> <rect x="210" y="45" width="180" height="45" rx="6" ry="6" fill="#f0f0f0" stroke="#ccc"/> <text x="300" y="72" dominant-baseline="middle">R2: unparseable y₁ → KEEP</text> <rect x="405" y="45" width="180" height="45" rx="6" ry="6" fill="#f0f0f0" stroke="#ccc"/> <text x="495" y="72" dominant-baseline="middle">R3: same answer → KEEP</text> <rect x="15" y="100" width="180" height="45" rx="6" ry="6" fill="#FFF3E0" stroke="#FFB74D"/> <text x="105" y="127" dominant-baseline="middle">R4: REPLACE only if conf ≥ τ</text> <rect x="210" y="100" width="180" height="45" rx="6" ry="6" fill="#f0f0f0" stroke="#ccc"/> <text x="300" y="127" dominant-baseline="middle">R5: selector failure → KEEP</text> <rect x="405" y="100" width="180" height="45" rx="6" ry="6" fill="#f0f0f0" stroke="#ccc"/> <text x="495" y="118" dominant-baseline="middle">R6: ŷ = y₁ iff d=1</text> <text x="495" y="136" dominant-baseline="middle">else y₀</text> </g> </g> <!-- Overall Bottom-Right Panel --> <g transform="translate(1360, 0)"> <rect x="0" y="0" width="940" height="340" rx="12" ry="12" class="color-default-box" stroke-width="2"/> <text x="470" y="40" class="bottom-panel-title">Supplementary Information</text> <g transform="translate(30, 70)"> <text class="bottom-panel-text" x="0" y="0" font-weight="bold">Example Context:</text> <text class="bottom-panel-text" x="0" y="30">Consider a math word problem (`x`). The baseline solver (`π_S`) produces an incorrect answer (`y₀`) due to a common reasoning error.</text> <text class="bottom-panel-text" x="0" y="80" font-weight="bold">Hint Generation (`h`):</text> <foreignObject x="0" y="105" width="900" height="60"> <p xmlns="http://www.w3.org/1999/xhtml" style="font-size: 19px; margin: 0; padding: 0;"> The Hint Policy (`π_θ`), trained on similar problems, generates a blind hint without solving the problem itself. <br/>Example `h`: <span style="font-family: monospace; background-color: #eee; padding: 2px 4px; border-radius: 4px;">"Remember to calculate the area of the circle, not the circumference."</span> </p> </foreignObject> <text class="bottom-panel-text" x="0" y="185" font-weight="bold">Challenger vs. Baseline:</text> <text class="bottom-panel-text" x="0" y="215"><tspan fill="#009688" font-weight="bold">Baseline (`y₀`):</tspan> The solver, without the hint, computes the circumference, resulting in an error. `EM(y₀)=0`.</text> <text class="bottom-panel-text" x="0" y="245"><tspan fill="#C66900" font-weight="bold">Challenger (`y₁`):</tspan> The same frozen solver (`π_S`), now conditioned on `h`, correctly computes the area.</text> <text class="bottom-panel-text" x="0" y="295" font-weight="bold">Selection &amp; Output (`ŷ`):</text> <text class="bottom-panel-text" x="0" y="325">The Selector, confident that `y₁` is a meaningful improvement over `y₀`, chooses REPLACE (`d=1`). The final output `ŷ` is the correct answer from the challenger. `EM(ŷ)=1`.</text> </g> </g> </g> <!-- Footer --> <text x="1200" y="955" class="footer-text">Inference-only residual pipeline · one-step Blind FF challenger · no multi-turn tree credit assignment</text> </svg>