<svg width="1400" height="650" viewBox="0 0 1400 650" xmlns="http://www.w3.org/2000/svg" style="background-color:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';"> <defs> <!-- Typography --> <style> .title-text { font-size: 26px; font-weight: bold; text-anchor: middle; } .stage-title { font-size: 16px; font-weight: bold; text-anchor: middle; fill: #555; } .model-badge { font-size: 14px; font-weight: 500; text-anchor: middle; fill: #333; } .model-name { font-size: 13px; font-family: 'Courier New', monospace; text-anchor: middle; } .io-label { font-size: 14px; font-weight: 500; text-anchor: middle; } .io-var { font-family: 'Times New Roman', serif; font-style: italic; font-size: 17px; } .example-text { font-size: 11px; fill: #666; font-style: italic; text-anchor: middle; } .arrow-label { font-size: 12px; fill: #444; text-anchor: middle; } .caption-text { font-size: 14px; text-anchor: middle; fill: #666; } .placeholder-label-ext { font-size: 11px; font-weight: 500; text-anchor: middle; fill: #555; } .placeholder-text-int { font-size: 11px; fill: #222; text-anchor: middle; } .outcome-tag { font-size: 10px; font-weight: bold; } .rules-title { font-size: 14px; font-weight: bold; fill: #333; text-anchor: middle; } .rules-text { font-size: 13px; fill: #333; } </style> <!-- Colors & Shapes --> <style> .module-box { stroke-width: 1.5; } .bg-solver { fill: #e0f3f8; stroke: #5b9aa0; } /* Soft Blue/Teal */ .bg-router { fill: #fdebd0; stroke: #f29864; } /* Warm Amber/Coral */ .bg-selector { fill: #f0f0f0; stroke: #666; } .data-box { fill: #fcfcfc; stroke: #ccc; stroke-width: 1; } .placeholder-box { fill: #cccccc; stroke: #666666; stroke-width:1; } .decision-block { fill:#ffffff; stroke: #888; stroke-width:1; } </style> <!-- Arrows & Lines --> <style> .arrow-line { stroke: #333; stroke-width: 1.5; fill: none; } .arrow-keep { stroke: #28a745; stroke-width: 2; } /* Green */ .arrow-replace { stroke: #fd7e14; stroke-width: 2; } /* Muted Orange */ .arrow-head { fill: #333; } .arrow-head-keep { fill: #28a745; } .arrow-head-replace { fill: #fd7e14; } </style> <!-- Markers --> <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head" /> </marker> <marker id="arrowhead-keep" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head-keep" /> </marker> <marker id="arrowhead-replace" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head-replace" /> </marker> </defs> <!-- Main Title --> <text x="700" y="45" class="title-text">HintFlow<tspan style="font-weight:normal;">_one</tspan>: one-step Blind Free-Form routing with conservative selection</text> <!-- Main Data Bus for Problem 'x' --> <path d="M 125 140 H 1050" class="arrow-line" style="stroke-dasharray: 3 3;"/> <circle cx="125" cy="140" r="4" fill="#333"/> <text x="100" y="120" class="io-label">Problem <tspan class="io-var">x</tspan></text> <!-- STAGE 0: Input --> <g id="stage-0-input"> <text x="125" y="85" class="stage-title">Stage 0: Input</text> <rect x="60" y="160" width="130" height="90" rx="8" ry="8" class="data-box" /> <text x="125" y="178" class="placeholder-label-ext">Input Icon</text> <rect x="87.5" y="188" width="75" height="50" rx="8" ry="8" class="placeholder-box" /> <text x="125" y="208" class="placeholder-text-int" dy="0em">[icon]: A document icon</text> <text x="125" y="208" class="placeholder-text-int" dy="1.1em">representing a math problem</text> <text x="125" y="208" class="placeholder-text-int" dy="2.2em">with symbols like ∫, Σ, α.</text> <text x="125" y="280" class="io-label">Math Problem <tspan class="io-var">x</tspan></text> <text x="125" y="300" class="example-text">e.g., "Find the area..."</text> </g> <!-- Path from Input Box to Bus --> <path d="M 125 160 V 140" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- ======================== BASELINE TRACK (TOP) ======================== --> <!-- STAGE 1: Bare Baseline --> <g id="stage-1-baseline"> <text x="325" y="85" class="stage-title">Stage 1: Bare Baseline</text> <rect x="250" y="160" width="150" height="110" rx="8" ry="8" class="module-box bg-solver"/> <text x="325" y="180" class="model-badge">Frozen Solver</text> <text x="325" y="198" class="model-name">GPT-OSS-20B</text> <text x="325" y="218" class="placeholder-label-ext">Solver Icon</text> <rect x="300" y="228" width="50" height="32" rx="4" ry="4" class="placeholder-box"/> <text x="325" y="244" class="placeholder-text-int">[icon]: Large, static blue</text> <text x="325" y="244" class="placeholder-text-int" dy="1em">brain/CPU with a padlock.</text> <!-- Input Arrow from Bus --> <path d="M 325 140 V 160" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="360" y="152" class="arrow-label">(no hint)</text> <!-- Output Arrow & Box --> <path d="M 325 270 V 320" class="arrow-line" marker-end="url(#arrowhead)"/> <rect x="265" y="320" width="120" height="70" rx="8" ry="8" class="data-box"/> <text x="325" y="342" class="io-label">Incumbent / Baseline</text> <text x="325" y="367" class="io-label"><tspan class="io-var">y</tspan><tspan dy="5" style="font-size:12px;">0</tspan></text> </g> <!-- ======================== CHALLENGER TRACK (BOTTOM) ======================== --> <!-- STAGE 2: Blind Free-Form Router --> <g id="stage-2-router"> <text x="560" y="115" class="stage-title">Stage 2: Blind Free-Form Router</text> <rect x="485" y="160" width="150" height="110" rx="8" ry="8" class="module-box bg-router"/> <text x="560" y="180" class="model-badge">Small Router</text> <text x="560" y="198" class="model-name">Qwen3-4B (Blind FF-SFT)</text> <text x="560" y="218" class="placeholder-label-ext">Router Icon</text> <rect x="535" y="228" width="50" height="32" rx="4" ry="4" class="placeholder-box" /> <text x="560" y="244" class="placeholder-text-int">[icon]: Small, agile orange</text> <text x="560" y="244" class="placeholder-text-int" dy="1em">compass or pathfinder.</text> <!-- Input Arrow from Bus (BLIND) --> <path d="M 560 140 V 160" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="515" y="152" class="arrow-label" style="font-weight:bold; fill: #c0392b;">BLIND</text> <!-- Output Arrow & Box --> <path d="M 560 270 V 320" class="arrow-line" marker-end="url(#arrowhead)"/> <rect x="480" y="320" width="160" height="70" rx="8" ry="8" class="data-box"/> <text x="560" y="342" class="io-label">Free-form Hint <tspan class="io-var">h</tspan></text> <text x="560" y="365" class="example-text">"Try integration by parts..."</text> </g> <!-- STAGE 3: Challenger Solve --> <g id="stage-3-challenger"> <text x="795" y="85" class="stage-title">Stage 3: Challenger Solve</text> <rect x="720" y="160" width="150" height="110" rx="8" ry="8" class="module-box bg-solver"/> <text x="795" y="180" class="model-badge">Frozen Solver</text> <text x="795" y="198" class="model-name">GPT-OSS-20B</text> <text x="795" y="213" class="model-name" style="font-size:10px;">(same weights)</text> <text x="795" y="228" class="placeholder-label-ext">Solver Icon</text> <rect x="770" y="238" width="50" height="22" rx="4" ry="4" class="placeholder-box"/> <text x="795" y="251" class="placeholder-text-int">[icon]: (Same as Stage 1)</text> <!-- Input Arrows --> <path d="M 795 140 V 160" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- From x bus --> <path d="M 640 355 H 720 V 215" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- From h --> <text x="680" y="343" class="arrow-label">+ hint <tspan class="io-var">h</tspan></text> <!-- Output Arrow & Box --> <path d="M 795 270 V 320" class="arrow-line" marker-end="url(#arrowhead)"/> <rect x="735" y="320" width="120" height="70" rx="8" ry="8" class="data-box"/> <text x="795" y="342" class="io-label">Challenger Solution</text> <text x="795" y="367" class="io-label"><tspan class="io-var">y</tspan><tspan dy="5" style="font-size:12px;">1</tspan></text> </g> <!-- ======================== CONVERGENCE & DECISION ======================== --> <!-- STAGE 4: Conservative Selector --> <g id="stage-4-selector"> <text x="1050" y="85" class="stage-title">Stage 4: Conservative Selector</text> <rect x="975" y="160" width="150" height="110" rx="8" ry="8" class="module-box bg-selector"/> <text x="1050" y="180" class="model-badge">Orch selector</text> <text x="1050" y="198" class="model-name">(Qwen3-4B) or rule</text> <!-- Decision Block --> <rect x="1005" y="215" width="90" height="30" rx="4" ry="4" class="decision-block"/> <text x="1027" y="234" style="fill:#28a745; font-weight:bold; font-size:12px;">KEEP</text> <path d="M 1050 215 V 245" style="stroke:#ccc;"/> <text x="1073" y="234" style="fill:#fd7e14; font-weight:bold; font-size:12px;">REPLACE</text> <text x="1050" y="255" class="placeholder-label-ext">Selector Icon</text> <rect x="1025" y="265" width="50" height="5" rx="2" ry="2" class="placeholder-box" /> <text x="1050" y="265" dy="-3" class="placeholder-text-int" style="font-size: 9px; visibility:hidden;">[icon]: A balanced scale or judge's gavel.</text> <!-- Input Arrows --> <path d="M 385 355 H 975 V 215" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- From y0 --> <text x="415" y="343" class="arrow-label"><tspan class="io-var">y</tspan><tspan dy="3" style="font-size:10px;">0</tspan></text> <path d="M 855 355 H 975 V 240" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- From y1 --> <text x="885" y="343" class="arrow-label"><tspan class="io-var">y</tspan><tspan dy="3" style="font-size:10px;">1</tspan></text> <path d="M 1050 140 V 160" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- From x bus --> <text x="1030" y="152" class="arrow-label" style="font-size:11px;">(+ <tspan class="io-var">x</tspan>)</text> <!-- Safety Rules Box --> <g id="safety-rules" transform="translate(925, 410)"> <rect x="0" y="0" width="250" height="135" rx="8" ry="8" style="fill:#f8f9fa; stroke:#ced4da; stroke-dasharray: 4 2;"/> <text x="125" y="18" class="rules-title">Fail-Closed Safety Rules</text> <text x="15" y="40" class="rules-text"><tspan style="fill:#28a745; font-weight:bold;">•</tspan> baseline-first default <tspan style="font-weight:bold">KEEP</tspan></text> <text x="15" y="60" class="rules-text"><tspan style="fill:#28a745; font-weight:bold;">•</tspan> unparseable <tspan class="io-var">y<tspan dy="3">1</tspan></tspan> → <tspan style="font-weight:bold">KEEP</tspan></text> <text x="15" y="80" class="rules-text"><tspan style="fill:#28a745; font-weight:bold;">•</tspan> same answer → <tspan style="font-weight:bold">KEEP</tspan></text> <text x="15" y="100" class="rules-text"><tspan style="fill:#fd7e14; font-weight:bold;">•</tspan> <tspan style="font-weight:bold">REPLACE</tspan> only if conf ≥ 0.90</text> <text x="15" y="120" class="rules-text"><tspan style="fill:#28a745; font-weight:bold;">•</tspan> selector failure → <tspan style="font-weight:bold">KEEP</tspan></text> </g> </g> <!-- STAGE 5: Final Output --> <g id="stage-5-final"> <text x="1275" y="85" class="stage-title">Stage 5: Final Output</text> <rect x="1200" y="215" width="150" height="70" rx="8" ry="8" class="data-box"/> <text x="1275" y="240" class="io-label">Final Answer <tspan class="io-var">ŷ</tspan></text> <text x="1275" y="265" class="example-text" style="font-size:12px;">ŷ = y₁ if REPLACE else y₀</text> <!-- Output Arrows from Selector --> <path d="M 1125 230 H 1200" class="arrow-line arrow-keep" marker-end="url(#arrowhead-keep)"/> <!-- KEEP --> <text x="1155" y="222" style="font-size:13px; fill:#28a745; font-weight:bold;">KEEP</text> <path d="M 1095 245 V 280 H 1200" class="arrow-line arrow-replace" marker-end="url(#arrowhead-replace)"/> <!-- REPLACE --> <text x="1155" y="292" style="font-size:13px; fill:#fd7e14; font-weight:bold;">REPLACE</text> <!-- Outcome Tags --> <g id="outcome-tags" transform="translate(1210, 300)"> <rect x="0" y="0" width="70" height="20" rx="4" style="fill:#d4edda;"/> <text x="35" y="14" class="outcome-tag" style="fill:#155724; text-anchor:middle">Recover</text> <rect x="0" y="25" width="70" height="20" rx="4" style="fill:#f8d7da;"/> <text x="35" y="39" class="outcome-tag" style="fill:#721c24; text-anchor:middle">Harm</text> <rect x="0" y="50" width="70" height="20" rx="4" style="fill:#e2e3e5;"/> <text x="35" y="64" class="outcome-tag" style="fill:#383d41; text-anchor:middle">No-change</text> </g> </g> <!-- Bottom Caption --> <text x="700" y="620" class="caption-text"> HintFlow<tspan style="font-weight:normal;">_one</tspan>: An inference pipeline where a "blind" router proposes a hint for a frozen solver. A conservative selector then chooses between the original baseline and the new challenger solution, prioritizing safety. </text> </svg>