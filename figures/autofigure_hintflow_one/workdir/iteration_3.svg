<svg width="1680" height="720" viewBox="0 0 1680 720" xmlns="http://www.w3.org/2000/svg" style="background-color:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';"> <defs> <!-- Typography --> <style> .title-text { font-size: 32px; font-weight: bold; text-anchor: middle; } .stage-title { font-size: 16px; font-weight: 600; text-anchor: middle; fill: #555; } .model-badge { font-size: 15px; font-weight: 500; text-anchor: middle; fill: #333; } .model-name { font-size: 13px; font-family: 'Courier New', monospace; text-anchor: middle; } .io-label { font-size: 14px; font-weight: 500; text-anchor: middle; } .io-var { font-family: 'Times New Roman', serif; font-style: italic; font-size: 18px; } .example-text { font-size: 12px; fill: #666; font-style: italic; text-anchor: middle; } .arrow-label { font-size: 13px; fill: #444; text-anchor: middle; } .caption-text { font-size: 14px; text-anchor: middle; fill: #666; } .placeholder-label-ext { font-size: 11px; font-weight: 500; text-anchor: middle; fill: #444; } .placeholder-text-int { font-size: 11px; fill: #222; text-anchor: middle; } .outcome-tag { font-size: 10px; font-weight: bold; text-anchor: middle; } .rules-title { font-size: 15px; font-weight: bold; fill: #333; text-anchor: middle; } .rules-text { font-size: 13px; fill: #333; } </style> <!-- Colors & Shapes --> <style> .module-box { stroke-width: 1.5; rx: 8; ry: 8; } .bg-solver { fill: #e0f3f8; stroke: #5b9aa0; } /* Soft Blue/Teal */ .bg-router { fill: #fdebd0; stroke: #f29864; } /* Warm Amber/Coral */ .bg-selector { fill: #f0f0f0; stroke: #666; } .data-box { fill: #fcfcfc; stroke: #aaa; stroke-width: 1.5; rx: 8; ry: 8; } .placeholder-box { fill: #cccccc; stroke: #666666; stroke-width:1; rx: 8; ry: 8; } </style> <!-- Arrows & Lines --> <style> .arrow-line { stroke: #333; stroke-width: 1.5; fill: none; } .arrow-keep { stroke: #28a745; stroke-width: 2.5; } /* Green */ .arrow-replace { stroke: #fd7e14; stroke-width: 2.5; } /* Muted Orange */ .line-dashed { stroke-dasharray: 5 3; } .arrow-head { fill: #333; } .arrow-head-keep { fill: #28a745; } .arrow-head-replace { fill: #fd7e14; } </style> <!-- Markers --> <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head" /> </marker> <marker id="arrowhead-keep" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head-keep" /> </marker> <marker id="arrowhead-replace" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head-replace" /> </marker> </defs> <!-- Title --> <text x="840" y="55" class="title-text">HintFlow<tspan style="font-weight:normal;">_one</tspan></text> <!-- ===================================================================== --> <!-- Problem Input & Baseline Path (Bottom Tier) --> <!-- ===================================================================== --> <!-- Stage 0: Input --> <g id="stage-0-input"> <text x="170" y="115" class="stage-title">Stage 0: Input</text> <rect x="95" y="190" width="150" height="90" class="data-box"/> <text x="170" y="215" class="io-label">Math Problem <tspan class="io-var">x</tspan></text> <text x="170" y="235" class="example-text">e.g., "Find the area..."</text> <text x="170" y="145" class="placeholder-label-ext">Input Icon</text> <rect x="140" y="155" width="60" height="40" class="placeholder-box"/> <text x="170" y="171" ><tspan class="placeholder-text-int">[icon]: A document with</tspan><tspan x="170" dy="1.2em" class="placeholder-text-int">math symbols: ∫, Σ, α</tspan></text> </g> <!-- Stage 1: Bare Baseline --> <g id="stage-1-baseline"> <text x="445" y="405" class="stage-title">Stage 1: Bare Baseline (always-on)</text> <rect x="370" y="420" width="150" height="120" class="module-box bg-solver"/> <text x="445" y="445" class="model-badge">Frozen Solver</text> <text x="445" y="463" class="model-name">GPT-OSS-20B</text> <text x="445" y="483" class="placeholder-label-ext">Solver Icon</text> <rect x="415" y="490" width="60" height="40" class="placeholder-box"/> <text x="445" y="506" class="placeholder-text-int"><tspan>[icon]: Large, static blue</tspan><tspan x="445" dy="1.2em">brain/CPU with a padlock.</tspan></text> <!-- Input Arrow to Baseline --> <path d="M 170 280 V 380 H 370" class="arrow-line" marker-end="url(#arrowhead)"/> <circle cx="170" cy="280" r="4" fill="#333"/> <text x="290" y="365" class="arrow-label" style="font-weight:bold;">(no hint)</text> <!-- Output from Baseline --> <rect x="580" y="445" width="150" height="70" class="data-box"/> <path d="M 520 480 H 580" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="655" y="467" class="io-label">Incumbent / Baseline</text> <text x="655" y="492" class="io-label"><tspan class="io-var">y</tspan><tspan dy="5" style="font-size:12px;">0</tspan></text> </g> <!-- ===================================================================== --> <!-- Challenger Path (Top Tier) --> <!-- ===================================================================== --> <!-- Problem 'x' feed line for top tier --> <path d="M 245 235 H 1050" class="arrow-line" style="stroke-width: 1.5;"/> <circle cx="245" cy="235" r="4" fill="#333"/> <text x="270" y="225" class="io-label"><tspan class="io-var">x</tspan></text> <!-- Stage 2: Blind Free-Form Router --> <g id="stage-2-router"> <text x="445" y="115" class="stage-title">Stage 2: Blind Free-Form Router</text> <rect x="370" y="130" width="150" height="120" class="module-box bg-router"/> <text x="445" y="155" class="model-badge">Small Router</text> <text x="445" y="173" class="model-name">Qwen3-4B (Blind FF-SFT)</text> <text x="445" y="193" class="placeholder-label-ext">Router Icon</text> <rect x="415" y="200" width="60" height="40" class="placeholder-box"/> <text x="445" y="216" class="placeholder-text-int"><tspan>[icon]: Small, agile orange</tspan><tspan x="445" dy="1.2em">compass or pathfinder.</tspan></text> <!-- Input from 'x' feed --> <path d="M 445 235 V 250" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="400" y="230" class="arrow-label" style="font-weight:bold; fill: #c0392b;">BLIND</text> <!-- Output Hint --> <rect x="580" y="155" width="150" height="70" class="data-box"/> <path d="M 520 190 H 580" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="655" y="177" class="io-label">Free-form Hint <tspan class="io-var">h</tspan></text> <text x="655" y="197" class="example-text">"Try integration by parts..."</text> </g> <!-- Stage 3: Challenger Solve --> <g id="stage-3-challenger"> <text x="840" y="115" class="stage-title">Stage 3: Challenger Solve</text> <rect x="765" y="130" width="150" height="120" class="module-box bg-solver"/> <text x="840" y="155" class="model-badge">Frozen Solver</text> <text x="840" y="173" class="model-name">GPT-OSS-20B</text> <text x="840" y="188" class="model-name" style="font-size:11px;">(same weights)</text> <text x="840" y="205" class="placeholder-label-ext">Solver Icon</text> <rect x="810" y="212" width="60" height="28" class="placeholder-box" style="rx:4; ry:4;"/> <text x="840" y="226" class="placeholder-text-int">[icon]: (Same as Stage 1)</text> <!-- Inputs to Challenger --> <path d="M 800 235 V 250" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- from x --> <path d="M 730 190 H 765" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- from h --> <text x="748" y="180" class="arrow-label">+ <tspan class="io-var">h</tspan></text> <!-- Output Challenger Solution --> <rect x="975" y="155" width="150" height="70" class="data-box"/> <path d="M 915 190 H 975" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="1050" y="177" class="io-label">Challenger Solution</text> <text x="1050" y="202" class="io-label"><tspan class="io-var">y</tspan><tspan dy="5" style="font-size:12px;">1</tspan></text> </g> <!-- ===================================================================== --> <!-- Selection & Final Output --> <!-- ===================================================================== --> <!-- Stage 4: Conservative Selector --> <g id="stage-4-selector"> <text x="1245" y="115" class="stage-title">Stage 4: Conservative Selector</text> <rect x="1170" y="130" width="150" height="120" class="module-box bg-selector"/> <text x="1245" y="155" class="model-badge">Selector</text> <text x="1245" y="173" class="model-name">(Qwen3-4B) or rule</text> <text x="1245" y="193" class="placeholder-label-ext">Selector Icon</text> <rect x="1215" y="200" width="60" height="40" class="placeholder-box"/> <text x="1245" y="216" class="placeholder-text-int"><tspan>[icon]: A balanced scale</tspan><tspan x="1245" dy="1.2em">or a judge's gavel icon.</tspan></text> <!-- Inputs to Selector --> <path d="M 1125 190 H 1170" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- from y1 --> <path d="M 730 480 H 1205 V 250" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- from y0 --> <path d="M 1210 235 V 250" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- from x --> <text x="1150" y="180" class="arrow-label"><tspan class="io-var">y</tspan><tspan dy="3" style="font-size:10px">1</tspan></text> <text x="1180" y="265" class="arrow-label"><tspan class="io-var">y</tspan><tspan dy="3" style="font-size:10px">0</tspan></text> <text x="1185" y="225" class="arrow-label">(+<tspan class="io-var">x</tspan>)</text> </g> <!-- Fail-Closed Safety Rules Box --> <g id="safety-rules" transform="translate(1120, 270)"> <rect x="0" y="0" width="250" height="140" rx="8" ry="8" style="fill:#f8f9fa; stroke:#ced4da;"/> <text x="125" y="20" class="rules-title">Fail-Closed Safety Rules</text> <path d="M 125 -10 V -30 " class="arrow-line line-dashed" /> <text x="10" y="45" class="rules-text"> <tspan fill="#28a745" font-weight="bold">•</tspan> baseline-first default <tspan font-weight="bold">KEEP</tspan> </text> <text x="10" y="65" class="rules-text"> <tspan fill="#28a745" font-weight="bold">•</tspan> unparseable <tspan class="io-var">y<tspan dy="3" style="font-size:10px">1</tspan></tspan> → <tspan font-weight="bold">KEEP</tspan> </text> <text x="10" y="85" class="rules-text"> <tspan fill="#28a745" font-weight="bold">•</tspan> same answer → <tspan font-weight="bold">KEEP</tspan> </text> <text x="10" y="105" class="rules-text"> <tspan fill="#fd7e14" font-weight="bold">•</tspan> <tspan font-weight="bold">REPLACE</tspan> only if conf(y₁) ≥ 0.90 </text> <text x="10" y="125" class="rules-text"> <tspan fill="#28a745" font-weight="bold">•</tspan> selector failure → <tspan font-weight="bold">KEEP</tspan> </text> </g> <!-- Output Decision Paths --> <g id="decision-paths"> <!-- REPLACE Path --> <path d="M 1320 175 H 1450" class="arrow-line arrow-replace" marker-end="url(#arrowhead-replace)"/> <text x="1385" y="167" class="arrow-label" style="font-weight:bold; fill:#fd7e14;">REPLACE</text> <!-- KEEP Path --> <path d="M 1320 215 H 1450" class="arrow-line arrow-keep" marker-end="url(#arrowhead-keep)"/> <text x="1385" y="227" class="arrow-label" style="font-weight:bold; fill:#28a745;">KEEP</text> <!-- Merge Point --> <path d="M 1450 175 V 185" class="arrow-line arrow-replace"/> <path d="M 1450 215 V 205" class="arrow-line arrow-keep"/> <path d="M 1450 185 C 1455 185, 1455 205, 1450 205" fill="none" class="arrow-line" stroke="#333" /> <path d="M 1452.5 195 H 1490" class="arrow-line" marker-end="url(#arrowhead)"/> </g> <!-- Stage 5: Final Output --> <g id="stage-5-final"> <text x="1565" y="115" class="stage-title">Stage 5: Final Output</text> <rect x="1490" y="155" width="150" height="80" class="data-box"/> <text x="1565" y="180" class="io-label">Final Answer <tspan class="io-var">ŷ</tspan></text> <text x="1565" y="208" class="example-text" style="font-size:12px;">ŷ = y₁ if REPLACE else y₀</text> <!-- Outcome Tags --> <g id="outcome-tags" transform="translate(1480, 250)"> <text x="85" y="-5" style="font-size:11px; text-anchor:middle; fill:#666;">(vs. baseline)</text> <rect x="0" y="10" width="70" height="20" rx="4" style="fill:#d4edda; stroke:#c3e6cb;"/> <text x="35" y="24" class="outcome-tag" style="fill:#155724;">Recover</text> <rect x="80" y="10" width="70" height="20" rx="4" style="fill:#f8d7da; stroke:#f5c6cb;"/> <text x="115" y="24" class="outcome-tag" style="fill:#721c24;">Harm</text> <rect x="40" y="35" width="90" height="20" rx="4" style="fill:#e2e3e5; stroke:#d6d8db;"/> <text x="85" y="49" class="outcome-tag" style="fill:#383d41;">No-change</text> </g> </g> <!-- Bottom Caption --> <text x="840" y="685" class="caption-text"> <tspan style="font-weight:bold;">HintFlow<tspan style="font-weight:normal;">_one</tspan>:</tspan> One-step Blind Free-Form (FF) challenger routing with a fail-closed, conservative KEEP/REPLACE selector. </text>
</svg>