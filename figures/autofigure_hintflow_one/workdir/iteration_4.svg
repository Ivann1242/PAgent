<svg width="1800" height="800" viewBox="0 0 1800 800" xmlns="http://www.w3.org/2000/svg" style="background-color:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';"> <defs> <!-- Typography --> <style> .title-text { font-size: 32px; font-weight: bold; text-anchor: middle; } .stage-title { font-size: 16px; font-weight: 600; text-anchor: middle; fill: #555; } .model-badge { font-size: 15px; font-weight: 500; text-anchor: middle; fill: #333; } .model-name { font-size: 13px; font-family: 'Courier New', monospace; text-anchor: middle; } .io-label { font-size: 14px; font-weight: 500; text-anchor: middle; } .io-var { font-family: 'Times New Roman', serif; font-style: italic; font-size: 18px; } .example-text { font-size: 12px; fill: #666; font-style: italic; text-anchor: middle; } .arrow-label { font-size: 13px; fill: #444; text-anchor: middle; } .caption-text { font-size: 14px; text-anchor: middle; fill: #666; } .placeholder-label-ext { font-size: 11px; font-weight: 500; text-anchor: middle; fill: #444; } .placeholder-text-int { font-size: 11px; fill: #222; text-anchor: middle; } .outcome-tag { font-size: 11px; font-weight: bold; text-anchor: middle; } .rules-title { font-size: 15px; font-weight: bold; fill: #333; text-anchor: middle; } .rules-text { font-size: 13px; fill: #333; } </style> <!-- Colors & Shapes --> <style> .module-box { stroke-width: 1.5; rx: 8; ry: 8; } .bg-solver { fill: #e0f3f8; stroke: #5b9aa0; } /* Soft Blue/Teal */ .bg-router { fill: #fdebd0; stroke: #f29864; } /* Warm Amber/Coral */ .bg-selector { fill: #f0f0f0; stroke: #666; } .data-box { fill: #fcfcfc; stroke: #aaa; stroke-width: 1.5; rx: 8; ry: 8; } .placeholder-box { fill: #cccccc; stroke: #666666; stroke-width:1; rx: 8; ry: 8; } </style> <!-- Arrows & Lines --> <style> .arrow-line { stroke: #333; stroke-width: 1.5; fill: none; } .arrow-keep { stroke: #28a745; stroke-width: 2.5; } /* Green */ .arrow-replace { stroke: #fd7e14; stroke-width: 2.5; } /* Muted Orange */ .line-dashed { stroke-dasharray: 6 4; stroke-width: 2.0; } .arrow-head { fill: #333; } .arrow-head-keep { fill: #28a745; } .arrow-head-replace { fill: #fd7e14; } </style> <!-- Markers --> <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head" /> </marker> <marker id="arrowhead-keep" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head-keep" /> </marker> <marker id="arrowhead-replace" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head-replace" /> </marker> </defs> <!-- Title --> <text x="900" y="55" class="title-text">HintFlow<tspan style="font-weight:normal;">_one</tspan></text> <!-- ===================================================================== --> <!-- Stage 0: Input -> Split --> <!-- ===================================================================== --> <g id="stage-0-input"> <text x="175" y="110" class="stage-title">Stage 0: Input</text> <rect x="100" y="360" width="150" height="80" class="data-box"/> <text x="175" y="380" class="io-label">Math Problem <tspan class="io-var">x</tspan></text> <text x="175" y="405" class="example-text">e.g., "Find the area..."</text> <text x="175" y="315" class="placeholder-label-ext">Input Icon</text> <rect x="145" y="325" width="60" height="40" class="placeholder-box"/> <text x="175" y="341" class="placeholder-text-int"> <tspan x="175" dy="-0.6em">[icon]: A document with</tspan> <tspan x="175" dy="1.2em">math symbols: ∫, Σ, α.</tspan> </text> <!-- Main Fork --> <path d="M 250 400 H 300" class="arrow-line"/> <path d="M 300 400 C 330 400, 320 300, 350 300" class="arrow-line" marker-end="url(#arrowhead)"/> <path d="M 300 400 C 330 400, 320 500, 350 500" class="arrow-line" marker-end="url(#arrowhead)"/> </g> <!-- Context line for problem 'x' --> <path d="M 175 350 V 150 H 835" class="arrow-line" style="stroke:#aab; stroke-width:1; stroke-dasharray: 4 4;"/> <circle cx="175" cy="350" r="4" fill="#aab"/> <path d="M 835 150 V 170" class="arrow-line" style="stroke:#aab; stroke-width:1; stroke-dasharray: 4 4;" marker-end="url(#arrowhead)"/> <text x="815" y="145" class="arrow-label" style="fill:#889;">context <tspan class="io-var">x</tspan></text> <path d="M 175 450 V 580 H 1225" class="arrow-line" style="stroke:#aab; stroke-width:1; stroke-dasharray: 4 4;"/> <circle cx="175" cy="450" r="4" fill="#aab"/> <path d="M 1225 580 V 460" class="arrow-line" style="stroke:#aab; stroke-width:1; stroke-dasharray: 4 4;" marker-end="url(#arrowhead)"/> <text x="1200" y="575" class="arrow-label" style="fill:#889;">context <tspan class="io-var">x</tspan></text> <!-- ===================================================================== --> <!-- Bottom Path: Baseline --> <!-- ===================================================================== --> <g id="baseline-path"> <!-- Stage 1: Bare Baseline --> <g id="stage-1-baseline"> <text x="440" y="420" class="stage-title">Stage 1: Bare Baseline (always-on)</text> <rect x="350" y="440" width="180" height="120" class="module-box bg-solver"/> <text x="440" y="465" class="model-badge">Frozen Solver</text> <text x="440" y="483" class="model-name">GPT-OSS-20B</text> <text x="440" y="503" class="placeholder-label-ext">Solver Icon</text> <rect x="410" y="510" width="60" height="40" class="placeholder-box"/> <text x="440" y="526" class="placeholder-text-int"> <tspan x="440" dy="-0.6em">[icon]: Large, static blue</tspan> <tspan x="440" dy="1.2em">brain/CPU with a padlock.</tspan> </text> <text x="390" y="495" class="arrow-label" style="font-weight:bold;">(no hint)</text> </g> <!-- Baseline Output y0 --> <path d="M 530 500 H 580" class="arrow-line" marker-end="url(#arrowhead)"/> <rect x="580" y="465" width="150" height="70" class="data-box"/> <text x="655" y="487" class="io-label">Incumbent / Baseline</text> <text x="655" y="512" class="io-label"><tspan class="io-var">y</tspan><tspan dy="5" style="font-size:12px;">0</tspan></text> <path d="M 730 500 h 380" class="arrow-line" marker-end="url(#arrowhead)"/> </g> <!-- ===================================================================== --> <!-- Top Path: Challenger --> <!-- ===================================================================== --> <g id="challenger-path"> <!-- Stage 2: Blind Router --> <g id="stage-2-router"> <text x="440" y="110" class="stage-title">Stage 2: Blind Free-Form Router</text> <rect x="350" y="240" width="180" height="120" class="module-box bg-router"/> <text x="440" y="265" class="model-badge">Small Router</text> <text x="440" y="283" class="model-name">Qwen3-4B (Blind FF-SFT)</text> <text x="440" y="303" class="placeholder-label-ext">Router Icon</text> <rect x="410" y="310" width="60" height="40" class="placeholder-box"/> <text x="440" y="326" class="placeholder-text-int"> <tspan x="440" dy="-0.6em">[icon]: Small, agile orange</tspan> <tspan x="440" dy="1.2em">compass or pathfinder.</tspan> </text> <path d="M325 300 H 350 " class="arrow-line"/> <text x="290" y="290" class="arrow-label" style="font-weight:bold; fill: #c0392b;">BLIND</text> <text x="290" y="305" class="arrow-label" style="font-size:11px;">(problem <tspan class="io-var">x</tspan> only, no <tspan class="io-var">y<tspan dy="2" style="font-size:9px;">0</tspan></tspan>)</text> </g> <!-- Hint Output h --> <path d="M 530 300 H 580" class="arrow-line" marker-end="url(#arrowhead)"/> <rect x="580" y="265" width="150" height="70" class="data-box"/> <text x="655" y="287" class="io-label">Free-form Hint <tspan class="io-var">h</tspan></text> <text x="655" y="307" class="example-text">"Try integration by parts..."</text> <path d="M 730 300 H 740" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="755" y="290" class="arrow-label">+ <tspan class="io-var">h</tspan></text> <!-- Stage 3: Challenger Solve --> <g id="stage-3-challenger"> <text x="835" y="110" class="stage-title">Stage 3: Challenger Solve</text> <rect x="745" y="180" width="180" height="120" class="module-box bg-solver"/> <text x="835" y="205" class="model-badge">Frozen Solver</text> <text x="835" y="223" class="model-name">GPT-OSS-20B</text> <text x="835" y="238" class="model-name" style="font-size:11px;">(same weights)</text> <text x="835" y="255" class="placeholder-label-ext">Solver Icon</text> <rect x="805" y="262" width="60" height="28" class="placeholder-box" style="rx:4; ry:4;"/> <text x="835" y="276" class="placeholder-text-int">[icon]: (Same as Stage 1)</text> </g> <!-- Challenger Output y1 --> <path d="M 925 240 H 970" class="arrow-line" marker-end="url(#arrowhead)"/> <rect x="970" y="205" width="150" height="70" class="data-box"/> <text x="1045" y="227" class="io-label">Challenger Solution</text> <text x="1045" y="252" class="io-label"><tspan class="io-var">y</tspan><tspan dy="5" style="font-size:12px;">1</tspan></text> <path d="M 1120 240 C 1135 240, 1135 360, 1110 360 H 1110" class="arrow-line" marker-end="url(#arrowhead)"/> </g> <!-- ===================================================================== --> <!-- Stage 4: Selector & Rules --> <!-- ===================================================================== --> <g id="stage-4-selector-and-rules"> <!-- Selector Module --> <text x="1225" y="210" class="stage-title">Stage 4: Conservative Selector</text> <rect x="1135" y="340" width="180" height="120" class="module-box bg-selector"/> <text x="1225" y="365" class="model-badge">Selector</text> <text x="1225" y="383" class="model-name">(Qwen3-4B) or rule</text> <text x="1225" y="403" class="placeholder-label-ext">Selector Icon</text> <rect x="1195" y="410" width="60" height="40" class="placeholder-box"/> <text x="1225" y="426" class="placeholder-text-int"> <tspan x="1225" dy="-0.6em">[icon]: A balanced scale</tspan> <tspan x="1225" dy="1.2em">or a judge's gavel icon.</tspan> </text> <text x="1090" y="355" class="io-label"><tspan class="io-var">y</tspan><tspan dy="5" style="font-size:12px;">1</tspan></text> <text x="1090" y="505" class="io-label"><tspan class="io-var">y</tspan><tspan dy="5" style="font-size:12px;">0</tspan></text> <!-- Fail-Closed Safety Rules Box --> <g id="safety-rules" transform="translate(1090, 520)"> <rect x="0" y="0" width="270" height="145" rx="8" ry="8" style="fill:#f8f9fa; stroke:#ced4da;"/> <text x="135" y="20" class="rules-title">Fail-Closed Safety Rules</text> <g class="rules-text" transform="translate(15, 45)"> <text y="0"><tspan fill="#28a745" font-weight="bold">•</tspan> baseline-first default <tspan font-weight="bold">KEEP</tspan></text> <text y="20"><tspan fill="#28a745" font-weight="bold">•</tspan> unparseable <tspan class="io-var">y<tspan dy="3" style="font-size:10px">1</tspan></tspan> → <tspan font-weight="bold">KEEP</tspan></text> <text y="40"><tspan fill="#28a745" font-weight="bold">•</tspan> same answer → <tspan font-weight="bold">KEEP</tspan></text> <text y="60"><tspan fill="#fd7e14" font-weight="bold">•</tspan> <tspan font-weight="bold">REPLACE</tspan> only if conf ≥ 0.90</text> <text y="80"><tspan fill="#28a745" font-weight="bold">•</tspan> selector failure → <tspan font-weight="bold">KEEP</tspan></text> </g> </g> <!-- Arrow from Selector to Rules --> <path d="M 1225 460 V 510" class="arrow-line line-dashed" marker-end="url(#arrowhead)"/> </g> <!-- ===================================================================== --> <!-- Decision Paths & Final Output --> <!-- ===================================================================== --> <g id="decision-and-output"> <!-- Decision Diamond --> <path d="M1315 400 l 50 -50 l 50 50 l -50 50 Z" class="module-box" style="fill:#fff"/> <text x="1365" y="380" style="font-size:11px; fill:#fd7e14; font-weight:bold;">REPLACE</text> <path d="M 1345 390 h 40" style="stroke:#aaa; stroke-width:1;"/> <text x="1365" y="425" style="font-size:11px; fill:#28a745; font-weight:bold;">KEEP</text> <path d="M1315 400 h-1" class="arrow-line"/> <!-- entry point --> <!-- REPLACE Path --> <path d="M 1415 400 H 1520" class="arrow-line arrow-replace" marker-end="url(#arrowhead-replace)"/> <text x="1465" y="390" class="arrow-label" style="font-weight:bold; fill:#fd7e14;">REPLACE</text> <!-- KEEP Path --> <path d="M 1365 450 V 500 H 1520" class="arrow-line arrow-keep" marker-end="url(#arrowhead-keep)"/> <text x="1440" y="515" class="arrow-label" style="font-weight:bold; fill:#28a745;">KEEP (Default)</text> <!-- Stage 5: Final Output --> <g id="stage-5-final"> <text x="1615" y="325" class="stage-title">Stage 5: Final Output</text> <rect x="1520" y="360" width="190" height="80" class="data-box"/> <text x="1615" y="385" class="io-label">Final Answer <tspan class="io-var">ŷ</tspan></text> <text x="1615" y="413" class="example-text" style="font-size:12px;"><tspan class="io-var">ŷ</tspan> = <tspan class="io-var">y</tspan><tspan dy="5" style="font-size:10px;">1</tspan> if REPLACE else <tspan class="io-var">y</tspan><tspan dy="5" style="font-size:10px;">0</tspan></text> </g> <!-- Outcome Tags --> <g id="outcome-tags" transform="translate(1550, 455)"> <text x="65" y="0" style="font-size:11px; text-anchor:middle; fill:#666;">(paired vs baseline)</text> <rect x="0" y="10" width="130" height="24" rx="4" style="fill:#d4edda; stroke:#c3e6cb;"/> <text x="65" y="27" class="outcome-tag" style="fill:#155724;">Recover (Corrected by <tspan class="io-var" style="font-size:10px;">y</tspan><tspan dy="3" style="font-size:8px;">1</tspan>)</text> <rect x="0" y="40" width="130" height="24" rx="4" style="fill:#f8d7da; stroke:#f5c6cb;"/> <text x="65" y="57" class="outcome-tag" style="fill:#721c24;">Harm (Incorrectly chose <tspan class="io-var" style="font-size:10px;">y</tspan><tspan dy="3" style="font-size:8px;">1</tspan>)</text> <rect x="0" y="70" width="130" height="24" rx="4" style="fill:#e2e3e5; stroke:#d6d8db;"/> <text x="65" y="87" class="outcome-tag" style="fill:#383d41;">No-change (Kept <tspan class="io-var" style="font-size:10px;">y</tspan><tspan dy="3" style="font-size:8px;">0</tspan>)</text> </g> </g> <!-- Bottom Caption --> <text x="900" y="750" class="caption-text"> <tspan style="font-weight:bold;">HintFlow<tspan style="font-weight:normal;">_one</tspan>:</tspan> one-step Blind FF challenger + fail-closed KEEP/REPLACE </text> </svg>