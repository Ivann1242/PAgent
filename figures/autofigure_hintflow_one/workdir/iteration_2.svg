<svg width="1400" height="750" viewBox="0 0 1400 750" xmlns="http://www.w3.org/2000/svg" style="background-color:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';"> <defs> <!-- Typography --> <style> .title-text { font-size: 26px; font-weight: bold; text-anchor: middle; } .stage-title { font-size: 16px; font-weight: bold; text-anchor: middle; fill: #555; } .model-badge { font-size: 14px; font-weight: 500; text-anchor: middle; fill: #333; } .model-name { font-size: 13px; font-family: 'Courier New', monospace; text-anchor: middle; } .io-label { font-size: 14px; font-weight: 500; text-anchor: middle; } .io-var { font-family: 'Times New Roman', serif; font-style: italic; font-size: 17px; } .example-text { font-size: 11px; fill: #666; font-style: italic; text-anchor: middle; } .arrow-label { font-size: 12px; fill: #444; text-anchor: middle; } .caption-text { font-size: 14px; text-anchor: middle; fill: #666; } .placeholder-label-ext { font-size: 11px; font-weight: 500; text-anchor: middle; fill: #555; } .placeholder-text-int { font-size: 11px; fill: #222; text-anchor: middle; } .outcome-tag { font-size: 10px; font-weight: bold; } .rules-title { font-size: 14px; font-weight: bold; fill: #333; text-anchor: middle; } .rules-text { font-size: 13px; fill: #333; } </style> <!-- Colors & Shapes --> <style> .module-box { stroke-width: 1.5; } .bg-solver { fill: #e0f3f8; stroke: #5b9aa0; } /* Soft Blue/Teal */ .bg-router { fill: #fdebd0; stroke: #f29864; } /* Warm Amber/Coral */ .bg-selector { fill: #f0f0f0; stroke: #666; } .data-box { fill: #fcfcfc; stroke: #ccc; stroke-width: 1.5; } .placeholder-box { fill: #cccccc; stroke: #666666; stroke-width:1; } .decision-block { fill:#ffffff; stroke: #888; stroke-width:1; } </style> <!-- Arrows & Lines --> <style> .arrow-line { stroke: #333; stroke-width: 1.5; fill: none; } .arrow-keep { stroke: #28a745; stroke-width: 2; } /* Green */ .arrow-replace { stroke: #fd7e14; stroke-width: 2; } /* Muted Orange */ .arrow-head { fill: #333; } .arrow-head-keep { fill: #28a745; } .arrow-head-replace { fill: #fd7e14; } </style> <!-- Markers --> <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head" /> </marker> <marker id="arrowhead-keep" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head-keep" /> </marker> <marker id="arrowhead-replace" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth"> <path d="M0,0 L8,3 L0,6 Z" class="arrow-head-replace" /> </marker> </defs> <!-- Main Title --> <text x="700" y="35" class="title-text">HintFlow<tspan style="font-weight:normal;">_one</tspan>: One-step Blind Free-Form Routing with Conservative Selection</text> <!-- ===================================================================== --> <!-- TOP ROW: STAGES 0-3 (INPUT, BASELINE, ROUTER, CHALLENGER) --> <!-- ===================================================================== --> <!-- STAGE 0: Input --> <g id="stage-0-input"> <text x="175" y="90" class="stage-title">Stage 0: Input</text> <rect x="110" y="120" width="130" height="110" rx="8" ry="8" class="data-box" /> <text x="175" y="140" class="placeholder-label-ext">Input Icon</text> <rect x="137.5" y="150" width="75" height="50" rx="8" ry="8" class="placeholder-box" /> <text x="175" y="170"><tspan class="placeholder-text-int">[icon]: A document representing</tspan><tspan class="placeholder-text-int" x="175" dy="1.2em">a math problem with symbols</tspan><tspan class="placeholder-text-int" x="175" dy="1.2em">like ∫, Σ, α.</tspan></text> <text x="175" y="270" class="io-label">Math Problem <tspan class="io-var">x</tspan></text> <text x="175" y="290" class="example-text">e.g., "Find the area..."</text> </g> <!-- Problem x Data Bus --> <path d="M 240 175 H 1125" class="arrow-line" style="stroke-dasharray: 4 4;" marker-end="url(#arrowhead)"/> <circle cx="240" cy="175" r="4" fill="#333"/> <text x="300" y="165" class="io-label">Problem <tspan class="io-var">x</tspan></text> <!-- STAGE 1: Bare Baseline --> <g id="stage-1-baseline"> <text x="450" y="90" class="stage-title">Stage 1: Bare Baseline</text> <rect x="375" y="120" width="150" height="110" rx="8" ry="8" class="module-box bg-solver"/> <text x="450" y="140" class="model-badge">Frozen Solver</text> <text x="450" y="158" class="model-name">GPT-OSS-20B</text> <text x="450" y="178" class="placeholder-label-ext">Solver Icon</text> <rect x="425" y="188" width="50" height="32" rx="4" ry="4" class="placeholder-box"/> <text x="450" y="204" class="placeholder-text-int"><tspan>[icon]: Large, static blue</tspan><tspan x="450" dy="1.1em">brain/CPU with a padlock.</tspan></text> <!-- Input Arrow from Bus --> <path d="M 450 175 V 120" class="arrow-line" marker-start="url(#arrowhead)"/> <text x="485" y="140" class="arrow-label">(no hint)</text> <!-- Output Arrow & Box --> <path d="M 450 230 V 285" class="arrow-line" marker-end="url(#arrowhead)"/> <rect x="390" y="285" width="120" height="70" rx="8" ry="8" class="data-box"/> <text x="450" y="307" class="io-label">Incumbent / Baseline</text> <text x="450" y="332" class="io-label"><tspan class="io-var">y</tspan><tspan dy="5" style="font-size:12px;">0</tspan></text> </g> <!-- STAGE 2: Blind Free-Form Router --> <g id="stage-2-router"> <text x="725" y="90" class="stage-title">Stage 2: Blind Free-Form Router</text> <rect x="650" y="120" width="150" height="110" rx="8" ry="8" class="module-box bg-router"/> <text x="725" y="140" class="model-badge">Small Router</text> <text x="725" y="158" class="model-name">Qwen3-4B (Blind FF-SFT)</text> <text x="725" y="178" class="placeholder-label-ext">Router Icon</text> <rect x="700" y="188" width="50" height="32" rx="4" ry="4" class="placeholder-box"/> <text x="725" y="204" class="placeholder-text-int"><tspan>[icon]: Small, agile orange</tspan><tspan x="725" dy="1.1em">compass or pathfinder.</tspan></text> <!-- Input Arrow from Bus (BLIND) --> <path d="M 725 175 V 120" class="arrow-line" marker-start="url(#arrowhead)"/> <text x="680" y="140" class="arrow-label" style="font-weight:bold; fill: #c0392b;">BLIND</text> <!-- Output Arrow & Box --> <path d="M 725 230 V 285" class="arrow-line" marker-end="url(#arrowhead)"/> <rect x="645" y="285" width="160" height="70" rx="8" ry="8" class="data-box"/> <text x="725" y="307" class="io-label">Free-form Hint <tspan class="io-var">h</tspan></text> <text x="725" y="330" class="example-text">"Try integration by parts..."</text> </g> <!-- STAGE 3: Challenger Solve --> <g id="stage-3-challenger"> <text x="1000" y="90" class="stage-title">Stage 3: Challenger Solve</text> <rect x="925" y="120" width="150" height="110" rx="8" ry="8" class="module-box bg-solver"/> <text x="1000" y="140" class="model-badge">Frozen Solver</text> <text x="1000" y="158" class="model-name">GPT-OSS-20B</text> <text x="1000" y="171" class="model-name" style="font-size:10px;">(same weights)</text> <text x="1000" y="186" class="placeholder-label-ext">Solver Icon</text> <rect x="975" y="196" width="50" height="24" rx="4" ry="4" class="placeholder-box"/> <text x="1000" y="210" class="placeholder-text-int">[icon]: (Same as Stage 1)</text> <!-- Input Arrows --> <path d="M 1000 175 V 120" class="arrow-line" marker-start="url(#arrowhead)"/> <!-- From x bus --> <path d="M 805 320 C 855 320, 875 200, 925 200" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- From h --> <text x="850" y="280" class="arrow-label">+ hint <tspan class="io-var">h</tspan></text> <!-- Output Arrow & Box --> <path d="M 1000 230 V 285" class="arrow-line" marker-end="url(#arrowhead)"/> <rect x="940" y="285" width="120" height="70" rx="8" ry="8" class="data-box"/> <text x="1000" y="307" class="io-label">Challenger Solution</text> <text x="1000" y="332" class="io-label"><tspan class="io-var">y</tspan><tspan dy="5" style="font-size:12px;">1</tspan></text> </g> <!-- ===================================================================== --> <!-- BOTTOM ROW: STAGES 4-5 (SELECTOR, FINAL OUTPUT) --> <!-- ===================================================================== --> <!-- STAGE 4: Conservative Selector --> <g id="stage-4-selector"> <text x="725" y="410" class="stage-title">Stage 4: Conservative Selector</text> <rect x="650" y="440" width="150" height="120" rx="8" ry="8" class="module-box bg-selector"/> <text x="725" y="460" class="model-badge">Orch selector</text> <text x="725" y="478" class="model-name">(Qwen3-4B) or rule</text> <text x="725" y="498" class="placeholder-label-ext">Selector Icon</text> <rect x="695" y="508" width="60" height="40" rx="8" ry="8" class="placeholder-box"/> <text x="725" y="528" class="placeholder-text-int"><tspan>[icon]: A balanced scale</tspan><tspan x="725" dy="1.2em">or a judge's gavel icon.</tspan></text> <!-- Input Arrows --> <path d="M 450 355 V 470 C 450 490, 500 490, 650 490" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- From y0 --> <text x="450" y="375" class="arrow-label">Incumbent <tspan class="io-var">y</tspan><tspan dy="3" style="font-size:10px;">0</tspan></text> <path d="M 1000 355 V 510 C 1000 530, 950 530, 800 530" class="arrow-line" marker-end="url(#arrowhead)"/> <!-- From y1 --> <text x="1000" y="375" class="arrow-label">Challenger <tspan class="io-var">y</tspan><tspan dy="3" style="font-size:10px;">1</tspan></text> <path d="M 725 175 V 440" class="arrow-line" style="stroke-dasharray: 4 4;" marker-end="url(#arrowhead)"/> <!-- From x bus --> <text x="700" y="400" class="arrow-label">(+ <tspan class="io-var">x</tspan>)</text> </g> <!-- Fail-Closed Safety Rules Box --> <g id="safety-rules" transform="translate(875, 430)"> <rect x="0" y="0" width="250" height="135" rx="8" ry="8" style="fill:#f8f9fa; stroke:#ced4da; stroke-dasharray: 4 2;"/> <text x="125" y="18" class="rules-title">Fail-Closed Safety Rules</text> <text x="15" y="40" class="rules-text"><tspan style="fill:#28a745; font-weight:bold;">•</tspan> baseline-first default <tspan style="font-weight:bold">KEEP</tspan></text> <text x="15" y="60" class="rules-text"><tspan style="fill:#28a745; font-weight:bold;">•</tspan> unparseable <tspan class="io-var">y<tspan dy="3" style="font-size:10px">1</tspan></tspan> → <tspan style="font-weight:bold">KEEP</tspan></text> <text x="15" y="80" class="rules-text"><tspan style="fill:#28a745; font-weight:bold;">•</tspan> same answer → <tspan style="font-weight:bold">KEEP</tspan></text> <text x="15" y="100" class="rules-text"><tspan style="fill:#fd7e14; font-weight:bold;">•</tspan> <tspan style="font-weight:bold">REPLACE</tspan> only if conf ≥ 0.90</text> <text x="15" y="120" class="rules-text"><tspan style="fill:#28a745; font-weight:bold;">•</tspan> selector failure → <tspan style="font-weight:bold">KEEP</tspan></text> </g> <!-- STAGE 5: Final Output --> <g id="stage-5-final"> <text x="1250" y="410" class="stage-title">Stage 5: Final Output</text> <rect x="1175" y="465" width="150" height="70" rx="8" ry="8" class="data-box"/> <text x="1250" y="490" class="io-label">Final Answer <tspan class="io-var">ŷ</tspan></text> <text x="1250" y="515" class="example-text" style="font-size:12px;">ŷ = y₁ if REPLACE else y₀</text> <!-- Decision Diamond --> <g transform="translate(800, 500)"> <path d="M 0,-25 L 25,0 L 0,25 L -25,0 Z" class="decision-block" /> <text x="0" y="-8" style="fill:#28a745; font-weight:bold; font-size:10px;">KEEP</text> <text x="0" y="12" style="fill:#fd7e14; font-weight:bold; font-size:10px;">REPLACE</text> </g> <!-- Output Arrows from Selector Decision --> <path d="M 825 500 H 1175" class="arrow-line arrow-keep" marker-end="url(#arrowhead-keep)"/> <!-- KEEP --> <text x="960" y="492" style="font-size:13px; fill:#28a745; font-weight:bold;">KEEP</text> <path d="M800,525 C 800,575 1175,575 1175,525" class="arrow-line arrow-replace" marker-end="url(#arrowhead-replace)"/> <!-- REPLACE --> <text x="980" y="580" style="font-size:13px; fill:#fd7e14; font-weight:bold;">REPLACE</text> <!-- Outcome Tags --> <g id="outcome-tags" transform="translate(1185, 550)"> <rect x="0" y="0" width="70" height="20" rx="4" style="fill:#d4edda;"/> <text x="35" y="14" class="outcome-tag" style="fill:#155724; text-anchor:middle">Recover</text> <rect x="80" y="0" width="70" height="20" rx="4" style="fill:#f8d7da;"/> <text x="115" y="14" class="outcome-tag" style="fill:#721c24; text-anchor:middle">Harm</text> <rect x="40" y="25" width="70" height="20" rx="4" style="fill:#e2e3e5;"/> <text x="75" y="39" class="outcome-tag" style="fill:#383d41; text-anchor:middle">No-change</text> </g> </g> <!-- Bottom Caption --> <text x="700" y="710" class="caption-text"> <tspan x="700" dy="0em">HintFlow<tspan style="font-weight:normal;">_one</tspan>: An inference pipeline where a "blind" router proposes a hint for a frozen solver. A conservative selector then chooses</tspan> <tspan x="700" dy="1.4em">between the original baseline and the new challenger solution, prioritizing safety through fail-closed rules.</tspan> </text>
</svg>