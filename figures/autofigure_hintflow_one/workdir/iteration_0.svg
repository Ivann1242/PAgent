<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" style="background-color:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';"> <defs> <style> /* Typography */ .title-text { font-size: 24px; font-weight: bold; text-anchor: middle; } .stage-title { font-size: 16px; font-weight: bold; text-anchor: middle; } .model-badge { font-size: 13px; font-weight: 500; text-anchor: middle; fill: #333; } .model-name { font-size: 12px; font-family: 'Courier New', monospace; text-anchor: middle; } .io-label { font-size: 14px; text-anchor: middle; } .io-var { font-family: 'Times New Roman', serif; font-style: italic; font-size: 16px; } .example-text { font-size: 11px; fill: #555; font-style: italic; text-anchor: middle; } .arrow-label { font-size: 12px; fill: #444; text-anchor: middle; } .caption-text { font-size: 13px; text-anchor: middle; fill: #666; } .placeholder-text { font-size: 11px; fill: #333; text-anchor: middle; } .outcome-tag { font-size: 10px; font-weight: 500; } .rules-title { font-size: 14px; font-weight: bold; fill: #333; } .rules-text { font-size: 13px; fill: #333; } /* Shapes &amp; Colors */ .bg-solver { fill: #d1eaf1; stroke: #5b9aa0; } /* Soft Blue/Teal */ .bg-router { fill: #fbe5d6; stroke: #f29864; } /* Warm Amber/Coral */ .bg-selector { fill: #e8e8e8; stroke: #666; } .data-box { fill: #f9f9f9; stroke: #bbb; stroke-width: 1; } .placeholder-box { fill: #cccccc; stroke: #666666; stroke-width: 1; } /* Arrows &amp; Lines */ .arrow-line { stroke: #333; stroke-width: 1.5; fill: none; } .arrow-head { fill: #333; } .arrow-keep { stroke: #2d8a39; } .arrow-replace { stroke: #d9534f; } .arrow-head-keep { fill: #2d8a39; } .arrow-head-replace { fill: #d9534f; } /* Decision Elements */ .decision-keep { fill: #d4edda; stroke: #2d8a39; } .decision-replace { fill: #f8d7da; stroke: #d9534f; } </style> <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto"> <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" /> </marker> <marker id="arrowhead-keep" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto"> <polygon points="0 0, 10 3.5, 0 7" class="arrow-head-keep" /> </marker> <marker id="arrowhead-replace" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto"> <polygon points="0 0, 10 3.5, 0 7" class="arrow-head-replace" /> </marker> </defs> <!-- Main Title --> <text x="600" y="35" class="title-text">HintFlow<tspan style="font-weight:normal;">_one</tspan>: One-Step Blind Free-Form Routing</text> <!-- STAGE 0: Input --> <g id="stage-0-input"> <text x="100" y="95" class="stage-title">Input</text> <rect x="50" y="240" width="100" height="70" rx="8" ry="8" class="data-box" /> <text x="100" y="265" class="io-label">Math Problem <tspan class="io-var">x</tspan></text> <text x="100" y="285" class="example-text">e.g., "Find the area..."</text> <!-- Placeholder for Input Icon --> <text x="100" y="125" class="model-badge">Problem</text> <rect x="75" y="135" width="50" height="50" rx="8" ry="8" class="placeholder-box" /> <text x="100" y="155" class="placeholder-text">[icon]: A document icon</text> <text x="100" y="168" class="placeholder-text">representing a math problem</text> <text x="100" y="181" class="placeholder-text">with symbols like ∫, Σ, α.</text> </g> <!-- STAGE 1: Bare Baseline --> <g id="stage-1-baseline"> <rect x="250" y="105" width="160" height="100" rx="8" ry="8" class="bg-solver" /> <text x="330" y="135" class="model-badge">Frozen Solver</text> <text x="330" y="155" class="model-name">GPT-OSS-20B</text> <!-- Placeholder for Solver Icon --> <rect x="260" y="130" width="50" height="50" rx="8" ry="8" class="placeholder-box" /> <text x="285" y="150" class="placeholder-text">[icon]: Large, static blue</text> <text x="285" y="163" class="placeholder-text">brain/CPU icon with a</text> <text x="285" y="176" class="placeholder-text">padlock, showing 'frozen'.</text> <path d="M155,275 H 250" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="202" y="265" class="arrow-label">(no hint)</text> <rect x="280" y="240" width="100" height="70" rx="8" ry="8" class="data-box" /> <text x="330" y="260" class="io-label">Baseline Solution</text> <text x="330" y="285" class="io-label"><tspan class="io-var">y</tspan><tspan dy="3" style="font-size:10px;">0</tspan> (incumbent)</text> </g> <!-- STAGE 2: Blind Router --> <g id="stage-2-router"> <rect x="440" y="105" width="160" height="100" rx="8" ry="8" class="bg-router" /> <text x="520" y="135" class="model-badge">Small Router</text> <text x="520" y="155" class="model-name">Qwen3-4B (Blind FF-SFT)</text> <!-- Placeholder for Router Icon --> <rect x="450" y="130" width="50" height="50" rx="8" ry="8" class="placeholder-box" /> <text x="475" y="150" class="placeholder-text">[icon]: Small, orange,</text> <text x="475" y="163" class="placeholder-text">agile compass or brain</text> <text x="475" y="176" class="placeholder-text">icon suggesting guidance.</text> <!-- BLIND ARROW: from problem x ONLY --> <path d="M150,250 C 180,180 410,180 440,160" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="310" y="170" class="arrow-label" style="font-weight:bold; fill: #c0392b;">BLIND: problem only</text> <path d="M520,205 V 240" class="arrow-line" marker-end="url(#arrowhead)"/> <rect x="470" y="240" width="100" height="70" rx="8" ry="8" class="data-box" /> <text x="520" y="265" class="io-label">Free-form Hint <tspan class="io-var">h</tspan></text> <text x="520" y="285" class="example-text">"Try integration by parts..."</text> </g> <!-- STAGE 3: Challenger Solve --> <g id="stage-3-challenger"> <rect x="630" y="105" width="160" height="100" rx="8" ry="8" class="bg-solver" /> <text x="710" y="135" class="model-badge">Frozen Solver</text> <text x="710" y="155" class="model-name">GPT-OSS-20B</text> <text x="710" y="170" class="model-name" style="font-size:10px;">(same weights)</text> <!-- Placeholder for Solver Icon --> <rect x="640" y="130" width="50" height="50" rx="8" ry="8" class="placeholder-box" /> <text x="665" y="150" class="placeholder-text">[icon]: Large, static blue</text> <text x="665" y="163" class="placeholder-text">brain/CPU icon with a</text> <text x="665" y="176" class="placeholder-text">padlock, showing 'frozen'.</text> <!-- Arrows into Challenger --> <path d="M570,275 H 630" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="600" y="265" class="arrow-label">+ hint <tspan class="io-var">h</tspan></text> <path d="M150,290 C 200,340 580,340 630,175" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="600" y="195" class="arrow-label">+ problem <tspan class="io-var">x</tspan></text> <path d="M710,205 V 240" class="arrow-line" marker-end="url(#arrowhead)"/> <rect x="660" y="240" width="100" height="70" rx="8" ry="8" class="data-box" /> <text x="710" y="260" class="io-label">Challenger Solution</text> <text x="710" y="285" class="io-label"><tspan class="io-var">y</tspan><tspan dy="3" style="font-size:10px;">1</tspan></text> </g> <!-- STAGE 4: Conservative Selector --> <g id="stage-4-selector"> <text x="880" y="95" class="stage-title">Conservative Selector</text> <rect x="800" y="105" width="160" height="100" rx="8" ry="8" class="bg-selector" /> <!-- Placeholder for Selector Icon --> <rect x="810" y="130" width="50" height="50" rx="8" ry="8" class="placeholder-box" /> <text x="835" y="150" class="placeholder-text">[icon]: A set of balanced</text> <text x="835" y="163" class="placeholder-text">scales or a judge's gavel,</text> <text x="835" y="176" class="placeholder-text">symbolizing a decision.</text> <text x="880" y="225" class="model-badge">Orch selector (Qwen3-4B)</text> <text x="880" y="238" class="model-badge" style="font-size: 11px;">or rule fallback</text> <!-- Decision Diamond --> <path d="M880 120 L 920 155 L 880 190 L 840 155 Z" style="fill:#fff; stroke:#666;"/> <text x="862" y="159" class="model-badge" style="fill:#2d8a39;">KEEP</text> <path d="M880 155 L 900 155" style="stroke:#aaa; stroke-width:1"/> <text x="900" y="159" class="model-badge" style="fill:#d9534f;">REPLACE</text> <!-- Arrows into Selector --> <path d="M380,275 C 450,305 780,305 840,175" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="790" y="200" class="arrow-label"><tspan class="io-var">y</tspan><tspan dy="3" style="font-size:10px;">0</tspan></text> <path d="M760,275 H 840" transform="translate(0, -30)" class="arrow-line" marker-end="url(#arrowhead)"/> <text x="800" y="235" class="arrow-label"><tspan class="io-var">y</tspan><tspan dy="3" style="font-size:10px;">1</tspan></text> </g> <!-- Safety Rules Callout --> <g id="safety-rules"> <rect x="780" y="325" width="200" height="150" rx="8" ry="8" style="fill:#f5f5f5; stroke:#ccc; stroke-dasharray: 4 2;"/> <text x="880" y="343" class="rules-title">Fail-Closed Safety Rules</text> <text x="795" y="365" class="rules-text"><tspan style="fill:#2d8a39; font-weight:bold;">•</tspan> Default to KEEP (baseline-first)</text> <text x="795" y="385" class="rules-text"><tspan style="fill:#2d8a39; font-weight:bold;">•</tspan> Unparseable <tspan class="io-var">y</tspan><tspan dy="3">1</tspan> &#8594; KEEP</text> <text x="795" y="405" class="rules-text"><tspan style="fill:#2d8a39; font-weight:bold;">•</tspan> Same answer &#8594; KEEP</text> <text x="795" y="425" class="rules-text"><tspan style="fill:#d9534f; font-weight:bold;">•</tspan> REPLACE only if conf(y1 &gt; y0) &#8805; 0.90</text> <text x="795" y="445" class="rules-text"><tspan style="fill:#2d8a39; font-weight:bold;">•</tspan> Selector failure &#8594; KEEP</text> </g> <!-- STAGE 5: Final Output --> <g id="stage-5-output"> <text x="1070" y="95" class="stage-title">Final Output</text> <!-- Converging Arrows --> <path d="M960,170 C 1000,200 1000,240 1020,260" class="arrow-line arrow-keep" marker-end="url(#arrowhead-keep)"/> <text x="980" y="225" class="arrow-label" style="fill:#2d8a39;">KEEP</text> <path d="M960,140 C 1000,110 1000,220 1020,250" class="arrow-line arrow-replace" marker-end="url(#arrowhead-replace)"/> <text x="980" y="140" class="arrow-label" style="fill:#d9534f;">REPLACE</text> <rect x="1020" y="240" width="100" height="70" rx="8" ry="8" class="data-box" /> <text x="1070" y="265" class="io-label">Final Answer <tspan class="io-var">ŷ</tspan></text> <text x="1070" y="288" class="example-text" style="font-size:12px;">ŷ = y₁ if REPLACE else y₀</text> <!-- Outcome Tags --> <g id="outcome-tags" transform="translate(1135, 250)"> <rect x="0" y="0" width="55" height="18" rx="4" style="fill:#d4edda;"/> <text x="5" y="13" class="outcome-tag" style="fill:#155724;">Recover</text> <rect x="0" y="22" width="55" height="18" rx="4" style="fill:#f8d7da;"/> <text x="5" y="35" class="outcome-tag" style="fill:#721c24;">Harm</text> <rect x="0" y="44" width="55" height="18" rx="4" style="fill:#e2e3e5;"/> <text x="5" y="57" class="outcome-tag" style="fill:#383d41;">No-change</text> </g> </g> <!-- Bottom Caption --> <text x="600" y="500" class="caption-text"> Figure: The HintFlow<tspan style="font-weight:normal;">_one</tspan> inference pipeline. A small, blind router proposes a free-form hint to guide a frozen solver, creating a challenger solution. A conservative, fail-closed selector then decides whether to KEEP the baseline or REPLACE it, maximizing recovery while suppressing harm. </text> </svg>