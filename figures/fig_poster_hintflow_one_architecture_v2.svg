<svg width="1600" height="620" viewBox="0 0 1600 620" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'"> <style> /* General Styles */ .title { font-size: 32px; font-weight: 600; text-anchor: middle; fill: #111827; } .stage-header { font-size: 16px; font-weight: 600; text-anchor: middle; fill: #4b5563; text-transform: uppercase; letter-spacing: 0.5px; } .main-label { font-size: 18px; font-weight: 500; text-anchor: middle; fill: #1f2937; } .model-name { font-size: 17px; font-weight: 600; text-anchor: middle; fill: #1f2937; } .sub-label { font-size: 15px; text-anchor: middle; fill: #4b5563; } .arrow-label { font-size: 16px; font-weight: 500; text-anchor: middle; fill: #374151; } .italic { font-style: italic; } /* Box Styles */ .module-box { stroke-width: 1.5; rx: 12; ry: 12; } .trainable-router { fill: #fffbeb; stroke: #f59e0b; } /* Warm Amber */ .frozen-solver { fill: #eff6ff; stroke: #3b82f6; } /* Cool Blue */ /* Text &amp; Decision Styles */ .keep-text { fill: #166534; font-weight: 600; } /* Green */ .replace-text { fill: #b91c1c; font-weight: 600; } /* Coral/Red */ /* Arrow Styles */ .arrow-path { fill: none; stroke: #6b7281; stroke-width: 1.5; } /* Placeholder Styles */ .placeholder-rect { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; } .placeholder-label-ext { font-size: 16px; font-weight: 600; text-anchor: middle; fill: #4b5563; } .placeholder-label-int { font-size: 14px; text-anchor: middle; fill: #6b7281; } /* Safety Strip Styles */ .safety-bar { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1; } .safety-chip { font-family: 'ui-monospace', 'Menlo', 'Monaco', 'Cascadia Mono', 'Segoe UI Mono', 'Roboto Mono', 'Oxygen Mono', 'Ubuntu Monospace', 'Source Code Pro', 'Fira Mono', 'Droid Sans Mono', 'Courier New', monospace; font-size: 14px; font-weight: 500; text-anchor: middle; } /* Caption */ .caption { font-size: 16px; text-anchor: middle; fill: #4b5563; } </style> <defs> <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto"> <polygon points="0 0, 10 3.5, 0 7" fill="#6b7281" /> </marker> </defs> <!-- Main Title --> <text x="800" y="50" class="title">HintFlow_one — Blind Free-Form Routing with Fail-Closed Selection</text> <!-- Stage Headers --> <text x="175" y="100" class="stage-header">1. Problem</text> <text x="500" y="100" class="stage-header">2. Routing</text> <text x="850" y="100" class="stage-header">3. Solving</text> <text x="1200" y="100" class="stage-header">4. Selection</text> <text x="1450" y="100" class="stage-header">5. Output</text> <!-- FLOWCHART ELEMENTS --> <!-- 1. Problem Input --> <g id="problem-input"> <text x="175" y="275" class="placeholder-label-ext">Problem</text> <rect x="125" y="290" width="100" height="90" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="175" y="325" class="placeholder-label-int">[icon]: A document icon</text> <text x="175" y="345" class="placeholder-label-int">with a large question</text> <text x="175" y="365" class="placeholder-label-int">mark on it.</text> <text x="175" y="405" class="main-label italic">x</text> </g> <!-- 2. Small Router --> <g id="router-module"> <rect x="420" y="145" width="160" height="150" class="module-box trainable-router"/> <text x="500" y="175" class="main-label">Small Router</text> <text x="500" y="200" class="model-name">Qwen3-4B</text> <text x="500" y="220" class="sub-label">Blind FF-SFT</text> <rect x="460" y="235" width="80" height="45" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="500" y="260" class="placeholder-label-int">[icon]: A small robot</text> <text x="500" y="275" class="placeholder-label-int">directs traffic.</text> </g> <!-- 3a. Challenger Solver --> <g id="challenger-solver-module"> <rect x="770" y="145" width="160" height="150" class="module-box frozen-solver"/> <text x="850" y="175" class="main-label">Frozen Solver</text> <text x="850" y="200" class="model-name">GPT-OSS-20B</text> <text x="850" y="220" class="sub-label">(problem + hint)</text> <rect x="810" y="235" width="80" height="45" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="850" y="260" class="placeholder-label-int">[icon]: Large server</text> <text x="850" y="275" class="placeholder-label-int">with a padlock</text> </g> <!-- 3b. Baseline Solver --> <g id="baseline-solver-module"> <rect x="770" y="345" width="160" height="150" class="module-box frozen-solver"/> <text x="850" y="375" class="main-label">Frozen Solver</text> <text x="850" y="400" class="model-name">GPT-OSS-20B</text> <text x="850" y="420" class="sub-label">(no hint)</text> <rect x="810" y="435" width="80" height="45" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="850" y="460" class="placeholder-label-int">[icon]: Large server</text> <text x="850" y="475" class="placeholder-label-int">with a padlock</text> </g> <!-- 4. Conservative Selector --> <g id="selector-module"> <rect x="1120" y="245" width="160" height="150" class="module-box trainable-router"/> <text x="1200" y="275" class="main-label">Conservative Selector</text> <text x="1200" y="300" class="model-name">Qwen3-4B</text> <text x="1200" y="320" class="sub-label">conf &gt;= 0.90</text> <rect x="1160" y="335" width="80" height="45" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="1200" y="360" class="placeholder-label-int">[icon]: Robot holding</text> <text x="1200" y="375" class="placeholder-label-int">a scale &amp; magnifier.</text> <!-- KEEP/REPLACE Decision Logic --> <text x="1200" y="425" class="arrow-label"> <tspan class="keep-text">KEEP (default)</tspan> <tspan dx="8"> | </tspan> <tspan dx="8" class="replace-text">REPLACE</tspan> </text> </g> <!-- Outcome Legend --> <g id="outcome-legend"> <rect x="100" y="450" width="220" height="60" rx="8" ry="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5" /> <text x="210" y="468" class="main-label" font-size="16px">Outcome</text> <circle cx="125" cy="490" r="6" fill="#22c55e" /> <text x="140" y="495" font-size="14px" fill="#374151">Recover</text> <circle cx="215" cy="490" r="6" fill="#ef4444" /> <text x="230" y="495" font-size="14px" fill="#374151">Harm</text> <!-- Use a neutral light gray for no-change --> <circle cx="295" cy="490" r="6" fill="#d1d5db" /> <text x="310" y="495" font-size="14px" fill="#374151">No-change</text> </g> <!-- 5. Final Output --> <g id="final-output"> <text x="1450" y="340" class="main-label" font-size="24px" font-weight="600">Final <tspan class="italic">ŷ</tspan></text> </g> <!-- ARROWS and LABELS --> <g class="arrows" marker-end="url(#arrowhead)"> <!-- Problem -> Router --> <path d="M 225,310 C 300,260 380,220 420,220" class="arrow-path"/> <!-- Problem -> Baseline Solver --> <path d="M 225,370 C 400,420 580,420 770,420" class="arrow-path"/> <text x="500" y="440" class="arrow-label">Example: "Let's re-examine this assumption..."</text> <!-- Router -> Hint -> Challenger Solver --> <path d="M 580,220 L 770,220" class="arrow-path"/> <text x="675" y="200" class="arrow-label">free-form hint <tspan class="italic">h</tspan></text> <!-- Challenger Solver -> Selector --> <path d="M 930,220 C 1000,220 1080,275 1120,290" class="arrow-path"/> <text x="1025" y="240" class="arrow-label">challenger <tspan class="italic">y₁</tspan></text> <text x="1025" y="260" class="sub-label">e.g., "The capital is Ottawa."</text> <!-- Baseline Solver -> Selector --> <path d="M 930,420 C 1000,420 1080,365 1120,350" class="arrow-path"/> <text x="1025" y="400" class="arrow-label">baseline <tspan class="italic">y₀</tspan></text> <text x="1025" y="420" class="sub-label">e.g., "I'm not sure."</text> <!-- Selector -> Decision -> Final Output --> <path d="M 1200,395 V 445" class="arrow-path"/> <path d="M 1200,445 C 1200,485 1380,485 1380,340" class="arrow-path" /> <path d="M 1380,340 H 1430" class="arrow-path"/> </g> <!-- SAFETY STRIP (BOTTOM) --> <g id="safety-strip"> <rect x="250" y="530" width="1100" height="40" rx="20" class="safety-bar" /> <text class="safety-chip"> <tspan x="400" y="555">baseline-first → <tspan class="keep-text">KEEP</tspan></tspan> <tspan x="590" y="555">·· unparseable → <tspan class="keep-text">KEEP</tspan></tspan> <tspan x="780" y="555">·· same ans → <tspan class="keep-text">KEEP</tspan></tspan> <tspan x="995" y="555">·· <tspan class="replace-text">REPLACE</tspan> iff conf &gt;= 0.90</tspan> <tspan x="1220" y="555">·· fail → <tspan class="keep-text">KEEP</tspan></tspan> </text> </g> <!-- CAPTION --> <text x="800" y="600" class="caption">One-step Blind FF challenger + conservative KEEP/REPLACE; strong solver frozen.</text>
</svg>